<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CropDoctor AI - AI Chatbot</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background:#f4fbf4;
    font-family:Arial,sans-serif;
}

.sidebar{
    min-height:100vh;
    background:#198754;
    color:#fff;
}

.sidebar a{
    color:#fff;
    text-decoration:none;
    display:block;
    padding:15px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.chat-box{
    height:500px;
    overflow-y:auto;
    padding:20px;
    background:#f8f9fa;
    border-radius:15px;
}

.user-message{
    background:#198754;
    color:white;
    padding:12px 18px;
    border-radius:20px 20px 0 20px;
    margin-bottom:15px;
    max-width:75%;
    margin-left:auto;
}

.bot-message{
    background:white;
    color:#333;
    padding:12px 18px;
    border-radius:20px 20px 20px 0;
    margin-bottom:15px;
    max-width:75%;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.input-group input{
    border-radius:30px 0 0 30px;
}

.input-group button{
    border-radius:0 30px 30px 0;
}

h2{
    color:#198754;
}
</style>

</head>
<body>

<div class="container-fluid">
<div class="row">

<!-- Sidebar -->

<div class="col-lg-2 sidebar p-0">

<h3 class="p-3">🌱 CropDoctor AI</h3>

<a href="index.html"><i class="bi bi-house"></i> Home</a>
<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="disease.html"><i class="bi bi-bug"></i> Disease Detection</a>
<a href="irrigation.html"><i class="bi bi-droplet"></i> Smart Irrigation</a>
<a href="monitoring.html"><i class="bi bi-activity"></i> Crop Monitoring</a>
<a href="weather.html"><i class="bi bi-cloud-sun"></i> Weather</a>
<a href="market.html"><i class="bi bi-graph-up"></i> Market Prices</a>
<a href="chatbot.html"><i class="bi bi-robot"></i> AI Chatbot</a>
<a href="contact.html"><i class="bi bi-envelope"></i> Contact</a>

</div>

<!-- Main Content -->

<div class="col-lg-10 p-4">

<div class="card p-4">

<h2 class="mb-4">
<i class="bi bi-robot"></i>
AI Farming Assistant
</h2>

<div class="chat-box" id="chatBox">

<div class="bot-message">
👋 Hello! I'm CropDoctor AI.<br><br>
Ask me anything about:
<ul>
<li>Crop Diseases</li>
<li>Fertilizers</li>
<li>Irrigation</li>
<li>Pesticides</li>
<li>Weather</li>
<li>Organic Farming</li>
</ul>
</div>

</div>

<div class="input-group mt-4">

<input
type="text"
class="form-control"
id="userInput"
placeholder="Ask your farming question...">

<button
class="btn btn-success"
id="sendBtn">

<i class="bi bi-send-fill"></i>

</button>

</div>

</div>

</div>

</div>
</div>

<script>

const chatBox=document.getElementById("chatBox");

const input=document.getElementById("userInput");

const sendBtn=document.getElementById("sendBtn");

function sendMessage(){

let message=input.value.trim();

if(message===""){
return;
}

chatBox.innerHTML+=`
<div class="user-message">
${message}
</div>
`;

input.value="";

/*

Connect Django API here later

POST

/api/chatbot/

Body:

{
"message":"How to treat tomato leaf curl?"
}

*/

setTimeout(()=>{

chatBox.innerHTML+=`
<div class="bot-message">
🤖 Thank you for your question.<br><br>
The AI response from your Django backend will appear here.
</div>
`;

chatBox.scrollTop=chatBox.scrollHeight;

},700);

}

sendBtn.onclick=sendMessage;

input.addEventListener("keypress",function(e){

if(e.key==="Enter"){
sendMessage();
}

});

</script>

</body>
</html>
