<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CropDoctor AI - Market Prices</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background:#f4fbf4;
    font-family:Arial,sans-serif;
}

.sidebar{
    min-height:100vh;
    background:#198754;
    color:white;
}

.sidebar a{
    color:white;
    text-decoration:none;
    display:block;
    padding:15px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.table th{
    background:#198754;
    color:white;
}

h2{
    color:#198754;
}

.market-card{
    display:none;
}
</style>
</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- Sidebar -->

<div class="col-lg-2 sidebar p-0">

<h3 class="p-3">🌱 CropDoctor AI</h3>

<a href="home.html"><i class="bi bi-house"></i> Home</a>
<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="disease.html"><i class="bi bi-bug"></i> Disease Detection</a>
<a href="irrigation.html"><i class="bi bi-droplet"></i> Smart Irrigation</a>
<a href="weather.html"><i class="bi bi-cloud-sun"></i> Weather</a>
<a href="market.html"><i class="bi bi-graph-up"></i> Market Prices</a>
<a href="chatbot.html"><i class="bi bi-robot"></i> AI Chatbot</a>
<a href="contact.html"><i class="bi bi-envelope"></i> Contact</a>

</div>

<!-- Main Content -->

<div class="col-lg-10 p-4">

<div class="card p-4">

<h2 class="mb-3">
<i class="bi bi-graph-up-arrow"></i>
Today's Market Prices
</h2>

<p>
Select a crop to view the latest estimated market price.
</p>

<hr>

<div class="row">

<div class="col-md-8">

<select class="form-select" id="cropSelect">

<option value="">Select Crop</option>

<option>Rice</option>
<option>Wheat</option>
<option>Maize</option>
<option>Cotton</option>
<option>Tomato</option>
<option>Potato</option>
<option>Onion</option>
<option>Sugarcane</option>
<option>Groundnut</option>

</select>

</div>

<div class="col-md-4">

<button class="btn btn-success w-100" id="priceBtn">

<i class="bi bi-search"></i>

Get Price

</button>

</div>

</div>

<div class="card mt-4 p-4 market-card" id="marketCard">

<h4 class="text-success mb-3">

<i class="bi bi-currency-rupee"></i>

Market Details

</h4>

<table class="table table-bordered">

<tr>
<th>Crop</th>
<td id="cropName"></td>
</tr>

<tr>
<th>Market Price</th>
<td id="cropPrice"></td>
</tr>

<tr>
<th>Market</th>
<td id="marketName"></td>
</tr>

<tr>
<th>State</th>
<td id="stateName"></td>
</tr>

<tr>
<th>Last Updated</th>
<td id="updatedTime"></td>
</tr>

</table>

</div>

</div>

</div>

</div>
</div>

<script>

document.getElementById("priceBtn").addEventListener("click",function(){

let crop=document.getElementById("cropSelect").value;

if(crop==""){

alert("Please select a crop.");

return;

}

/*

Later connect Django API

GET

/api/market/?crop=Rice

*/

document.getElementById("marketCard").style.display="block";

document.getElementById("cropName").innerHTML=crop;

document.getElementById("cropPrice").innerHTML="₹ 2,450 / Quintal";

document.getElementById("marketName").innerHTML="Hyderabad Agricultural Market";

document.getElementById("stateName").innerHTML="Telangana";

document.getElementById("updatedTime").innerHTML=new Date().toLocaleString();

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
