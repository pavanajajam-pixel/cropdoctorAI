<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CropDoctor AI - Weather Forecast</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background:#f4fbf4;
    font-family:Arial,sans-serif;
}

.sidebar{
    min-height:100vh;
    background:#198754;
    color:white;
}

.sidebar a{
    color:white;
    text-decoration:none;
    display:block;
    padding:15px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.weather-card{
    display:none;
}

.weather-icon{
    font-size:70px;
    color:#ffc107;
}

h2{
    color:#198754;
}
</style>

</head>
<body>

<div class="container-fluid">
<div class="row">

<!-- Sidebar -->

<div class="col-lg-2 sidebar p-0">

<h3 class="p-3">🌱 CropDoctor AI</h3>

<a href="index.html"><i class="bi bi-house"></i> Home</a>
<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="disease.html"><i class="bi bi-bug"></i> Disease Detection</a>
<a href="irrigation.html"><i class="bi bi-droplet"></i> Smart Irrigation</a>
<a href="weather.html"><i class="bi bi-cloud-sun"></i> Weather</a>
<a href="Market.html"><i class="bi bi-graph-up"></i> Market Prices</a>
<a href="chatbot.html"><i class="bi bi-robot"></i> AI Chatbot</a>
<a href="contact.html"><i class="bi bi-envelope"></i> Contact</a>

</div>

<!-- Main -->

<div class="col-lg-10 p-4">

<div class="card p-4">

<h2 class="mb-3">
<i class="bi bi-cloud-sun-fill"></i>
Weather Forecast
</h2>

<p>
Enter your city to get the latest weather information.
</p>

<hr>

<div class="row">

<div class="col-md-8">

<input
type="text"
class="form-control"
id="city"
placeholder="Enter City Name">

</div>

<div class="col-md-4">

<button
class="btn btn-success w-100"
id="weatherBtn">

<i class="bi bi-search"></i>

Get Weather

</button>

</div>

</div>

<div class="card mt-4 p-4 bg-light weather-card" id="weatherCard">

<div class="text-center">

<div class="weather-icon">
☀️
</div>

<h3 id="cityName">
Hyderabad
</h3>

<h1 id="temperature">
32°C
</h1>

<h5 id="condition">
Sunny
</h5>

</div>

<hr>

<div class="row text-center">

<div class="col-md-3">

<h6>Humidity</h6>

<h4 id="humidity">
68%
</h4>

</div>

<div class="col-md-3">

<h6>Wind</h6>

<h4 id="wind">
10 km/h
</h4>

</div>

<div class="col-md-3">

<h6>Pressure</h6>

<h4 id="pressure">
1012 hPa
</h4>

</div>

<div class="col-md-3">

<h6>Rain Chance</h6>

<h4 id="rain">
20%
</h4>

</div>

</div>

</div>

</div>

</div>

</div>
</div>

<script>

document.getElementById("weatherBtn").addEventListener("click",function(){

let city=document.getElementById("city").value.trim();

if(city==""){
alert("Please enter a city.");
return;
}

/*

Later connect Django API

GET

/api/weather/?city=Hyderabad

*/

document.getElementById("weatherCard").style.display="block";

document.getElementById("cityName").innerHTML=city;

document.getElementById("temperature").innerHTML="31°C";

document.getElementById("condition").innerHTML="Partly Cloudy";

document.getElementById("humidity").innerHTML="72%";

document.getElementById("wind").innerHTML="14 km/h";

document.getElementById("pressure").innerHTML="1011 hPa";

document.getElementById("rain").innerHTML="35%";

});

</script>

</body>
</html>
